<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিশেষ বার্তা</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* আগের পেজগুলোর মতো ব্যাকগ্রাউন্ড */
            background: radial-gradient(circle, #fff3e0 0%, #ffb74d 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 100%; max-width: 700px; background: #fff; padding: 40px;
            border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 4px solid #800000; text-align: center;
        }

        h2 { 
            color: #800000; margin-bottom: 25px; font-size: 28px; 
            font-family: 'Georgia', serif; border-bottom: 2px solid #d4af37; 
            display: inline-block; padding-bottom: 10px;
        }

        /* মজার লেখার বক্স */
        .funny-box {
            background: #fff9e6; padding: 30px; border-radius: 10px;
            border: 2px dashed #e53935; font-size: 20px; font-weight: bold;
            color: #b71c1c; line-height: 1.8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            margin-bottom: 35px;
        }

        /* কাউন্টডাউন টাইমার */
        .countdown {
            display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap;
        }
        
        .time-box {
            background: linear-gradient(45deg, #800000, #b71c1c);
            color: white; padding: 15px; border-radius: 10px; min-width: 80px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 2px solid #d4af37;
        }
        
        .time-box span { 
            display: block; font-size: 28px; font-weight: bold; color: #fbc02d; 
        }
        
        .time-box small { font-size: 14px; }

        /* ম্যাপ বাটন */
        .btn {
            display: inline-block; margin-top: 35px; padding: 12px 35px;
            background: linear-gradient(45deg, #d4af37, #fbc02d); color: #800000; 
            border: 2px solid #800000; border-radius: 30px; font-size: 18px; font-weight: bold; 
            cursor: pointer; text-decoration: none; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); 
            transition: 0.3s;
        }
        .btn:hover { background: #800000; color: #fff; border-color: #d4af37; }

        /* মোবাইলের জন্য রেসপন্সিভ */
        @media (max-width: 600px) {
            .container { padding: 25px; }
            h2 { font-size: 24px; }
            .funny-box { font-size: 17px; padding: 20px; }
            .time-box { min-width: 65px; padding: 10px; }
            .time-box span { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>আর একটি ছোট্ট কথা... 🤫</h2>
        
        <div class="funny-box">
            🎉 শুধু আশীর্বাদ করলে হবে না মশাই! <br><br>
            ভরপেট খাওয়া-দাওয়া, কবজি ডুবিয়ে বিরিয়ানি আর জমিয়ে নাচগান করতে হবে! 🕺💃<br><br>
            উপহার আনতে ভুলবেন না যেন! 🎁 <br>
            <span style="font-size: 14px; color: #555;">(মজা করলাম, আপনাদের আসাই সবচেয়ে বড় উপহার)।</span>
        </div>
        
        <h3 style="color: #800000; font-family: 'Georgia', serif;">বিয়ের বাকি আর মাত্র:</h3>
        
        <!-- কাউন্টডাউন টাইমার -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <small>দিন</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>ঘণ্টা</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>মিনিট</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>সেকেন্ড</small>
            </div>
        </div>

        <!-- ম্যাপ লোকেশন লিংক (এখানে # এর জায়গায় গুগল ম্যাপের লিংক বসিয়ে দিন) -->
        <a href="google map.html" class="btn">📍 গুগল ম্যাপ লোকেশন</a>
    </div>

    <script>
        // বিয়ের তারিখ ও সময় সেট করুন (Year, Month (0-11), Day, Hour, Minute, Second)
        // মাস 0 থেকে শুরু হয়, তাই 11 মানে ডিসেম্বর
        const weddingDate = new Date(2026, 11, 25, 19, 0, 0).getTime();

        const countdownTimer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(countdownTimer);
                document.querySelector(".countdown").innerHTML = "<h3 style='color: #800000; margin-top:10px;'>শুভ বিবাহ সম্পন্ন হয়েছে!</h3>";
            }
        }, 1000);
    </script>

</body>
</html>
